name: Validar Mate-fx (sin desplegar)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pages se publica desde la rama mediante GitHub. Este flujo solo comprueba.
concurrency:
  group: matefx-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de regresión, reportes y validez física
        run: node --test tests/investigation-core.test.mjs tests/investigation-pdf.test.mjs tests/investigation-quality.test.mjs
      - name: Verificar archivos publicados desde raíz
        run: |
          test -f index.html
          test -f assets/nprimos/index.html
          test -f assets/matefx/index.html
          test -f assets/nprimos/investigation-paper.mjs
          test -f assets/nprimos/investigation-desmos.mjs
          test -f assets/nprimos/investigation-quality.mjs
